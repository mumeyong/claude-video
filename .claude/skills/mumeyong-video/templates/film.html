<!doctype html>
<meta charset="utf-8">
<title>film</title>
<link rel="stylesheet" href="/web/lib/fonts.css">
<canvas></canvas>
<script type="module">
// EXAMPLE film (WEB.md) — works with any SCRIPT.md, so it shows the grammar, not a look to copy. Replace the look,
// the hero and the layout with this video's own idea. Kept: every time comes from the voice (T), computed once at
// setup; seek(t) only draws; cues are registered at setup.
import { FILM, ready, T, cue, canvas, beats, SAFE } from '/web/lib/film.js';
import { clamp, lerp, pulse, noise1 } from '/web/lib/motion.js';
import { iosAt, presence, rise, morphBox, dolly, applyCam, roundRect } from '/web/lib/apple.js';
await ready;

// ── look: 2 colors + 1 accent, one display face, one UI face ────────────────────────────────────
const BG = '#0E0E10', INK = '#F4F1EA', ACC = '#FF4A1C', MUTE = '#7E7C86', GRID = 'rgba(244,241,234,0.05)';
const DISPLAY = '"Inter Display"', MONO = '"JetBrains Mono"';
await document.fonts.load(`800 120px ${DISPLAY}`);
await document.fonts.load(`500 30px ${MONO}`);
const { W, H } = FILM;
const g0 = new OffscreenCanvas(1, 1).getContext('2d');

// ── layout, once: each spoken line as big kinetic type inside the safe box ─────────────────────
const lines = FILM.lines.filter((l) => l.start < FILM.end);
const BOX = { x: SAFE.x0, y: 760, w: SAFE.x1 - SAFE.x0, h: 700 };
function wrap(words, size) {
  g0.font = `800 ${size}px ${DISPLAY}`;
  const gap = size * 0.26, lh = size * 1.02, out = [];
  let x = 0, y = 0;
  for (const w of words) {
    const text = w.w.replace(/[.,!?;:"“”]+$/g, '');
    const ww = g0.measureText(text).width;
    if (x > 0 && x + ww > BOX.w) { x = 0; y += lh; }
    out.push({ ...w, text, x, y, ww });
    x += ww + gap;
  }
  return { words: out, height: y + lh, size };
}
const LAYOUT = lines.map((ln, i) => {
  let L;
  for (const size of [132, 116, 100, 88, 76, 66]) if ((L = wrap(ln.words, size)).height <= BOX.h) break;
  const next = lines[i + 1]?.start ?? FILM.end;
  return { ...L, line: ln, tIn: ln.start - 0.12, tOut: next - 0.36 };
});

// ── the hero: ONE accent shape that changes form on every line and never cuts ─────────────────
const SPOTS = [
  { x: SAFE.x0, y: 400, w: 260, h: 260, r: 130 },
  { x: SAFE.x1 - 420, y: 330, w: 420, h: 300, r: 36 },
  { x: SAFE.x0, y: 470, w: SAFE.x1 - SAFE.x0, h: 120, r: 60 },
  { x: SAFE.x1 - 260, y: 360, w: 260, h: 340, r: 130 },
];
const HERO = [[0, { x: -400, y: 900, w: 1880, h: 1880, r: 940 }],              // full-bleed under the sting
  ...lines.map((ln, i) => [ln.start - 0.25, SPOTS[i % SPOTS.length]])];

// ── sound: cues from the same times the picture uses ──────────────────────────────────────────
let chapter = null;
for (const ln of lines) {
  if (ln.chapter !== chapter && ln.start > FILM.pre_roll + 0.5) cue('whoosh', ln.start - 0.25, 0.45);
  chapter = ln.chapter;
}
for (const w of T.stressed()) if (w.start < FILM.end) cue('pop', w.start, 0.45);

// ── draw ────────────────────────────────────────────────────────────────────────────────────────
function grid(g, t) {
  const p = pulse(t, FILM.beats.downbeats, 5);
  g.strokeStyle = GRID; g.lineWidth = 2;
  g.globalAlpha = 1 + 2.5 * p;
  for (let x = 0; x <= W; x += 120) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  g.globalAlpha = 1;
}

function hero(g, t) {
  const b = morphBox(t, HERO, 'hero');
  const wob = 6 * noise1(t * 0.6, 3);
  roundRect(g, b.x + wob, b.y - wob, b.w, b.h, b.r);
  g.fillStyle = ACC; g.fill();
}

function kicker(g, t) {
  const cur = lines.findLast((l) => l.start - 0.3 <= t) || lines[0];
  const since = lines.find((l) => l.chapter === cur.chapter).start - 0.3;
  const a = presence(t, since, null, 'smooth').alpha;
  g.globalAlpha = a; g.font = `500 30px ${MONO}`; g.fillStyle = MUTE;
  g.fillText(cur.chapter.toUpperCase(), SAFE.x0, 290);
  g.globalAlpha = 1;
}

function words(g, t) {
  for (const L of LAYOUT) {
    if (t < L.tIn - 0.2 || t > L.tOut + 0.5) continue;
    g.font = `800 ${L.size}px ${DISPLAY}`;
    g.textBaseline = 'top';
    L.words.forEach((w) => {
      const x = BOX.x + w.x, y = BOX.y + w.y;
      rise(g, t, w.start - 0.12, L.tOut, [x, y, w.ww, L.size], (g) => {
        g.fillStyle = w.stress ? ACC : INK;
        g.fillText(w.text, x, y);
      }, { dy: w.stress ? 60 : 34, name: w.stress ? 'snappy' : 'smooth' });
    });
  }
}

canvas((g, t) => {
  g.fillStyle = BG; g.fillRect(0, 0, W, H);
  grid(g, t);
  const ln = lines.findLast((l) => l.start <= t);
  g.save();
  applyCam(g, { s: ln ? dolly(t, ln.start, ln.end + 0.4, 0.025) : 1, x: W / 2, y: H / 2 }, W, H);
  hero(g, t);
  kicker(g, t);
  words(g, t);
  g.restore();
});
</script>
