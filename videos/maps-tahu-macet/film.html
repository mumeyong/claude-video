<!doctype html>
<meta charset="utf-8">
<title>maps-tahu-macet</title>
<link rel="stylesheet" href="/web/lib/fonts.css">
<canvas></canvas>
<script type="module">
// Google Maps tahu jalan macet dari mana? — night asphalt seen from above. Every phone is a white dot; the road is
// re-painted BEHIND the dots in traffic colours (signature). PLAN.md has the frame per chapter. Every time comes from
// the voice (T), computed once at setup; the draw functions only read t.
import { FILM, ready, T, cue, canvas, SAFE } from '/web/lib/film.js';
import { clamp, lerp, noise1, rng, track } from '/web/lib/motion.js';
import { iosAt, iosTrack, arrive, follow, presence, rise, ease, push, applyCam, roundRect, dolly } from '/web/lib/apple.js';
await ready;

// ── look ───────────────────────────────────────────────────────────────────────────────────────
const GROUND = '#0E0F11', ASPH = '#1C1E22', BLOCK = '#16171B', ROOF = '#1C1E23';
const INK = '#F3EFE6', MARK = '#ECE7DB', MUTE = '#8C8C92', LINE = '#2A2C31';
const GREEN = '#2FBF71', AMBER = '#FFB020', RED = '#F2433A';
const WOOD = '#7B5B3C', WOOD_IN = '#231A13', COAT = '#4A4E58', HAIR = '#2A2522';
const PAINT_A = 0.78;                      // traffic paint over asphalt: the grain still shows through
const DISPLAY = '"Archivo Black"', MONO = '"IBM Plex Mono"';
const MARK_SX = 0.84, MARK_SY = 1.45;      // road-marking type is stretched along the road, like real "BUS" paint
await document.fonts.load(`400 200px ${DISPLAY}`);
await document.fonts.load(`500 30px ${MONO}`);
const { W, H } = FILM;
const g0 = new OffscreenCanvas(1, 1).getContext('2d');
const COL_W = SAFE.x1 - SAFE.x0;

// ── voice clock ────────────────────────────────────────────────────────────────────────────────
const L = (id) => T.line(id);
const w = (id, s, n = 0) => T.word(id, s, n);
const tB = L('L04').start - 0.3, tC = L('L07').start - 0.3, tD = L('L10').start - 0.3;
const tE = L('L13').start - 0.3, tF = L('L15').start - 0.3, tZ = FILM.end;
const XF = 0.42;                           // crossfade between compositions (the dot / the road carries over)

// ── helpers ────────────────────────────────────────────────────────────────────────────────────
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function mixC(a, b, p) {
  const A = hex(a), B = hex(b), q = clamp(p);
  return `rgb(${A.map((x, i) => Math.round(x + (B[i] - x) * q)).join(',')})`;
}
/** speed / free speed → traffic colour (Maps-style: green → amber → red). */
function speedColor(r) {
  if (r >= 0.74) return GREEN;
  if (r >= 0.58) return mixC(AMBER, GREEN, (r - 0.58) / 0.16);
  if (r >= 0.44) return AMBER;
  if (r >= 0.28) return mixC(RED, AMBER, (r - 0.28) / 0.16);
  return RED;
}
function dot(g, x, y, r, a = 1) {
  if (a <= 0.001) return;
  g.save(); g.globalAlpha *= a;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2);
  g.fillStyle = '#FFFFFF'; g.fill();
  g.lineWidth = Math.max(1.5, r * 0.22); g.strokeStyle = 'rgba(10,10,12,0.45)'; g.stroke();
  g.restore();
}
function chip(g, text, x, y, { size = 30, fg = INK, bg = 'rgba(10,10,12,0.88)', align = 'left', a = 1 } = {}) {
  g.save(); g.globalAlpha *= a;
  g.font = `500 ${size}px ${MONO}`;
  const padX = size * 0.6, h = size * 1.75, cw = g.measureText(text).width + 2 * padX;
  const x0 = align === 'left' ? x : align === 'right' ? x - cw : x - cw / 2;
  roundRect(g, x0, y, cw, h, h / 2); g.fillStyle = bg; g.fill();
  g.fillStyle = fg; g.textBaseline = 'middle'; g.textAlign = 'left';
  g.fillText(text, x0 + padX, y + h / 2 + 1);
  g.restore();
  return { x: x0, y, w: cw, h };
}
function chipW(text, size = 30) { g0.font = `500 ${size}px ${MONO}`; return g0.measureText(text).width + 1.2 * size; }
/** Largest Archivo size ≤ want that fits maxW. */
function fit(text, want, maxW = COL_W) { g0.font = `400 ${want}px ${DISPLAY}`; return Math.min(want, want * maxW / g0.measureText(text).width); }
/** Road-marking text: stretched along the road, painted on from the near edge (p 0 → 1). */
function markText(g, text, cx, cy, size, p, color = MARK) {
  if (p <= 0) return;
  g.save();
  g.translate(cx, cy); g.scale(MARK_SX, MARK_SY);
  const hh = size * 0.42;
  g.beginPath(); g.rect(-2000, hh - 2 * hh * clamp(p), 4000, 2 * hh * clamp(p) + 4); g.clip();
  g.font = `400 ${size}px ${DISPLAY}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = color; g.fillText(text, 0, 0);
  g.restore();
}
/** A big poster word on its own slot: rises in on tIn, leaves quietly at tOut. */
function poster(g, t, text, x, yBase, size, tIn, tOut, { color = INK, align = 'left', name = 'smooth' } = {}) {
  g.font = `400 ${size}px ${DISPLAY}`;
  const tw = g.measureText(text).width, x0 = align === 'left' ? x : align === 'right' ? x - tw : x - tw / 2;
  rise(g, t, tIn, tOut, [x0, yBase - size * 0.75, tw, size * 0.75], (g) => {
    g.font = `400 ${size}px ${DISPLAY}`; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.fillStyle = color; g.fillText(text, x0, yBase);
  }, { dy: 48, name });
}
function blocks(g, list) {
  for (const b of list) {
    roundRect(g, b.x, b.y, b.w, b.h, 10); g.fillStyle = BLOCK; g.fill();
    roundRect(g, b.x + 14, b.y + 14, b.w - 28, b.h - 28, 6); g.fillStyle = ROOF; g.fill();
  }
}
function makeBlocks(seed, x0, x1, y0, y1) {
  const R = rng(seed), out = [];
  for (let y = y0; y < y1;) {
    const h = 150 + R() * 210;
    out.push({ x: x0, y, w: x1 - x0, h: h - 22 });
    y += h;
  }
  return out;
}

// asphalt grain: one seeded texture, used as a pattern everywhere
const GRAIN = new OffscreenCanvas(256, 256);
{
  const x = GRAIN.getContext('2d'), R = rng(7);
  x.fillStyle = ASPH; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++) {
    const s = 1 + R() * 2.2;
    x.fillStyle = R() < 0.5 ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.22)';
    x.fillRect(R() * 256, R() * 256, s, s);
  }
}
let ASPHALT = ASPH;                        // becomes a pattern once the canvas exists (below)

// ── the cart (99 phones) — drawn pointing up, centred on its box ───────────────────────────────
const CART = { w: 220, h: 290 };
const PHONES = [];
for (let r = 0; r < 11; r++) for (let c = 0; c < 9; c++) PHONES.push({ dx: (c - 4) * 19, dy: (r - 5) * 22, i: PHONES.length });
const PICK = PHONES[5 * 9 + 4];            // the centre phone: the camera dives into it at "HP"
function drawCart(g, t, { world = 1, hl = 0 } = {}) {
  g.save(); g.globalAlpha *= world;
  g.fillStyle = '#0A0A0B';
  roundRect(g, -CART.w / 2 - 16, -42, 18, 84, 6); g.fill();
  roundRect(g, CART.w / 2 - 2, -42, 18, 84, 6); g.fill();
  g.strokeStyle = '#9A7A55'; g.lineWidth = 8; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-72, -CART.h / 2); g.lineTo(-38, -CART.h / 2 - 96);
  g.moveTo(72, -CART.h / 2); g.lineTo(38, -CART.h / 2 - 96); g.stroke();
  g.save(); g.translate(0, -CART.h / 2 - 124); g.rotate(0.06 * Math.sin(t * 5.2));
  g.beginPath(); g.ellipse(0, 0, 66, 30, 0, 0, Math.PI * 2); g.fillStyle = COAT; g.fill();
  g.beginPath(); g.arc(0, -2, 25, 0, Math.PI * 2); g.fillStyle = HAIR; g.fill();
  g.restore();
  roundRect(g, -CART.w / 2, -CART.h / 2, CART.w, CART.h, 14); g.fillStyle = WOOD; g.fill();
  roundRect(g, -CART.w / 2 + 12, -CART.h / 2 + 12, CART.w - 24, CART.h - 24, 8); g.fillStyle = WOOD_IN; g.fill();
  g.restore();
  for (const p of PHONES) {
    const pick = p === PICK;
    const jx = pick ? 0 : 1.6 * noise1(t * 1.1, p.i), jy = pick ? 0 : 1.6 * noise1(t * 1.1, p.i + 300);
    dot(g, p.dx + jx, p.dy + jy, 6.5 * (pick ? 1 + 0.35 * hl : 1), pick ? 1 : 1 - 0.55 * hl);
  }
}

// ═════════════════════════════════════════════════════════════════════════════════════════════
// INTRO — full-bleed road, the cart walks up, red paint behind it, "99 HP" painted on the asphalt
// ═════════════════════════════════════════════════════════════════════════════════════════════
const RA = { x0: 230, x1: 850 }, CART_X = 695;
const cartY = (t) => 1500 - 55 * (t - FILM.pre_roll);
const BLOCKS_A = [...makeBlocks(11, 20, 212, -260, 2200), ...makeBlocks(12, 868, 1060, -300, 2200)];
const tRed = w('L02', 'merah');
const tDim = w('L03', 'jalan') - 0.15;     // "Maps nggak ngelihat jalan": the real road fades, dots + paint stay
const tHP = w('L03', 'HP');
const pushT0 = tHP - 0.15, pushDur = Math.max(0.7, tB + 0.22 - pushT0), ZOOM = 9;
const t99 = FILM.pre_roll - 0.35, tHPmark = FILM.pre_roll + 0.05;

function intro(g, t) {
  const cy = cartY(t), top = cy - CART.h / 2;
  const world = 1 - 0.82 * ease(t, tDim, 0.6, 'apple');
  const hl = iosAt(t, tHP - 0.1, 'snappy');
  const home = { s: 1, x: W / 2, y: H / 2 };
  const cam = t < pushT0 ? home : push(t, pushT0, home, { s: ZOOM, x: CART_X + PICK.dx, y: cy + PICK.dy }, pushDur);
  g.fillStyle = GROUND; g.fillRect(0, 0, W, H);
  g.save(); applyCam(g, cam, W, H);
  g.globalAlpha = world; blocks(g, BLOCKS_A);
  g.fillStyle = ASPHALT; g.fillRect(RA.x0, -300, RA.x1 - RA.x0, H + 600);
  // traffic paint: green ahead, red from the cart down — then red sweeps ahead on "merah"
  g.globalAlpha = PAINT_A;
  g.fillStyle = GREEN; g.fillRect(RA.x0, -300, RA.x1 - RA.x0, top + 300);
  g.fillStyle = RED; g.fillRect(RA.x0, top, RA.x1 - RA.x0, H + 600 - top);
  const yF = lerp(top, -300, ease(t, tRed - 0.3, 1.0, 'apple_out'));
  if (yF < top) g.fillRect(RA.x0, yF, RA.x1 - RA.x0, top - yF);
  // real paint on the road (fades with the world)
  g.globalAlpha = world;
  g.fillStyle = MARK;
  g.fillRect(RA.x0 + 12, -300, 6, H + 600); g.fillRect(RA.x1 - 18, -300, 6, H + 600);
  for (let y = -300; y < H + 300; y += 120) g.fillRect(537, y, 6, 64);
  markText(g, '99', 385, 520, 210, ease(t, t99, 0.55, 'apple_out'));
  markText(g, 'HP', 385, 820, 210, ease(t, tHPmark, 0.55, 'apple_out'));
  g.globalAlpha = 1;
  g.save(); g.translate(CART_X, cy); drawCart(g, t, { world, hl }); g.restore();
  g.restore();
  // captions (screen space, bottom-left + top-left)
  const cIn = (t0) => presence(t, t0, tDim, 'snappy');
  const c1 = cIn(L('L01').start - 0.1), c2 = cIn(w('L02', 'kosong') - 0.1), c3 = cIn(tRed - 0.05);
  chip(g, 'BERLIN · 2020', SAFE.x0, 262 + 20 * (1 - c1.move), { a: c1.alpha, size: 34 });
  chip(g, 'JALAN: KOSONG', SAFE.x0, 1376 + 20 * (1 - c2.move), { a: c2.alpha });
  chip(g, 'MAPS: MACET', SAFE.x0, 1450 + 20 * (1 - c3.move), { a: c3.alpha, bg: RED, fg: '#140606' });
}

// ═════════════════════════════════════════════════════════════════════════════════════════════
// 00 SENSOR — macro: the dot becomes a phone (location ON → posisi ke Google), then a dot again that
// leaves crumbs (spacing = speed), loses its name, and gains company
// ═════════════════════════════════════════════════════════════════════════════════════════════
const R0 = 6.5 * ZOOM;
const B_DOT = { x: W / 2 - R0, y: H / 2 - R0, w: 2 * R0, h: 2 * R0, r: R0 };
const B_PHONE = { x: W / 2 - 170, y: 470, w: 340, h: 680, r: 56 };
const P0 = { x: 160, y: 1110 }, PC = { x: 560, y: 1230 }, P1 = { x: 880, y: 760 };
const bez = (u) => ({
  x: (1 - u) ** 2 * P0.x + 2 * (1 - u) * u * PC.x + u * u * P1.x,
  y: (1 - u) ** 2 * P0.y + 2 * (1 - u) * u * PC.y + u * u * P1.y,
});
const DOT_R = 36;
const tPhone = L('L04').start + 0.05, tToggle = w('L04', 'nyala'), tSend = w('L04', 'ngirim');
const tToDot = L('L05').start - 0.3, tMove = tToDot + 0.55;
const B_KEYS = [[tB - 2, B_DOT], [tPhone, B_PHONE],
  [tToDot, { x: P0.x - DOT_R, y: P0.y - DOT_R, w: 2 * DOT_R, h: 2 * DOT_R, r: DOT_R }]];
/** Path progress: quick first (crumbs far apart), then slow (crumbs bunch up). */
function pathU(t) {
  const d = t - tMove;
  if (d <= 0) return 0;
  if (d < 1.1) return 0.55 * d / 1.1;
  return 0.55 + 0.42 * (1 - Math.exp(-(d - 1.1) * 1.2));
}
const CRUMBS = [];
for (let k = 1; tMove + k * 0.34 < tC; k++) CRUMBS.push({ t: tMove + k * 0.34, ...bez(pathU(tMove + k * 0.34)) });
const tFast = w('L05', 'cepat'), tName = w('L06', 'Tanpa'), tTitik = w('L06', 'titik');
const PACKETS = [];
for (let tp = tSend; tp < L('L04').end + 0.2; tp += 0.3) PACKETS.push(tp);
const CROWD = (() => {
  const R = rng(31), out = [];
  for (let i = 0; i < 34; i++) out.push({ x: 110 + R() * 860, y: 280 + R() * 920, a: R() * Math.PI * 2, v: 12 + R() * 18 });
  return out;
})();
const B_WORDS = [['POSISI', w('L04', 'posisinya')], ['KECEPATAN', tFast - 0.1], ['TITIK', tTitik - 0.12]];
const B_SIZE = B_WORDS.map(([s]) => fit(s, s === 'TITIK' ? 300 : 170));

function sensor(g, t) {
  g.fillStyle = GROUND; g.fillRect(0, 0, W, H);
  // faint street grid drifting (zoomed-in map)
  g.save(); g.strokeStyle = 'rgba(243,239,230,0.06)'; g.lineWidth = 3;
  const off = 18 * (t - tB);
  for (let x = -200; x < W + 200; x += 180) { g.beginPath(); g.moveTo(x + off * 0.4, 0); g.lineTo(x + off * 0.4, H); g.stroke(); }
  for (let y = -200; y < H + 200; y += 180) { g.beginPath(); g.moveTo(0, y - off); g.lineTo(W, y - off); g.stroke(); }
  g.restore();
  // packets to Google
  const gp = presence(t, tSend - 0.2, tToDot, 'snappy');
  chip(g, 'GOOGLE', W / 2, 280, { align: 'center', a: gp.alpha, size: 34 });
  for (const tp of PACKETS) {
    const p = ease(t, tp, 0.6, 'apple_in_out');
    if (p <= 0 || p >= 1) continue;
    dot(g, W / 2, lerp(B_PHONE.y - 20, 350, p), 9, Math.min(1, (1 - p) * 3) * (1 - presence(t, tToDot, tToDot).out));
  }
  // the hero shape: dot → phone → dot
  const b = morphBox(t);
  const moved = bez(pathU(t)), base = bez(0);
  const isDot = t >= tToDot;
  const bx = b.x + (isDot ? moved.x - base.x : 0), by = b.y + (isDot ? moved.y - base.y : 0);
  // crumbs behind the moving dot
  for (const c of CRUMBS) {
    if (t < c.t) break;
    const a = iosAt(t, c.t, 'snappy');
    g.save(); g.globalAlpha = 0.7 * Math.min(1, a);
    g.beginPath(); g.arc(c.x, c.y, 18 * a, 0, Math.PI * 2); g.strokeStyle = INK; g.lineWidth = 6; g.stroke(); g.restore();
  }
  if (CRUMBS.length > 2) {   // the gap between two crumbs = speed
    const [c1, c2] = CRUMBS, bp = presence(t, tFast - 0.25, tName, 'smooth');
    if (bp.alpha > 0) {
      g.save(); g.globalAlpha = bp.alpha; g.strokeStyle = AMBER; g.lineWidth = 5;
      g.beginPath(); g.moveTo(c1.x, c1.y - 40); g.lineTo(c1.x + (c2.x - c1.x) * Math.min(1, bp.move), c1.y - 40 + (c2.y - c1.y) * Math.min(1, bp.move)); g.stroke();
      g.restore();
      chip(g, 'jarak ÷ waktu', (c1.x + c2.x) / 2, c1.y - 125, { align: 'center', a: bp.alpha, fg: '#1A1205', bg: AMBER });
    }
  }
  roundRect(g, bx, by, b.w, b.h, b.r); g.fillStyle = '#FFFFFF'; g.fill();
  const scr = clamp((b.w - 230) / 90);
  if (scr > 0) {
    g.save(); g.globalAlpha = scr;
    roundRect(g, bx + 16, by + 16, b.w - 32, b.h - 32, Math.max(8, b.r - 14)); g.fillStyle = '#131417'; g.fill();
    g.font = `500 32px ${MONO}`; g.fillStyle = INK; g.textBaseline = 'middle';
    g.fillText('Location', bx + 46, by + 112);
    const on = iosAt(t, tToggle - 0.12, 'snappy');
    const tx = bx + b.w - 46 - 92, ty = by + 88;
    roundRect(g, tx, ty, 92, 50, 25); g.fillStyle = mixC('#3A3C42', GREEN, on); g.fill();
    g.beginPath(); g.arc(tx + 25 + 42 * on, ty + 25, 20, 0, Math.PI * 2); g.fillStyle = '#FFFFFF'; g.fill();
    // a tiny map on the screen with you on it
    g.save(); roundRect(g, bx + 40, by + 190, b.w - 80, b.h - 250, 26); g.clip();
    g.fillStyle = '#1E2024'; g.fillRect(bx, by, b.w, b.h);
    g.strokeStyle = '#2C2F35'; g.lineWidth = 16;
    for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(bx, by + 260 + k * 110); g.lineTo(bx + b.w, by + 230 + k * 110); g.stroke(); }
    g.beginPath(); g.moveTo(bx + b.w * 0.55, by + 150); g.lineTo(bx + b.w * 0.45, by + b.h); g.stroke();
    g.restore();
    const ph = ((((t - tToggle) % 1.2) + 1.2) % 1.2) / 1.2;    // location ping, every 1.2 s
    if (on > 0.5) {
      g.beginPath(); g.arc(bx + b.w / 2, by + b.h * 0.6, 26 * (1 + 1.2 * ph), 0, Math.PI * 2);
      g.strokeStyle = `rgba(255,255,255,${0.6 * (1 - ph)})`; g.lineWidth = 4; g.stroke();
    }
    dot(g, bx + b.w / 2, by + b.h * 0.6, 18, on);
    g.restore();
  }
  // name tag that gets struck out
  const np = presence(t, tMove - 0.1, tTitik - 0.1, 'snappy');
  if (np.alpha > 0) {
    const cx = bx + b.w / 2, cy = by - 70;
    const r = chip(g, 'kamu', cx, cy, { align: 'center', a: np.alpha, size: 32 });
    const sp = ease(t, tName, 0.35, 'apple_out');
    if (sp > 0) { g.save(); g.globalAlpha = np.alpha; g.fillStyle = RED; g.fillRect(r.x + 10, r.y + r.h / 2 - 3, (r.w - 20) * sp, 6); g.restore(); }
  }
  // company: other dots fade in after "titik" (hand-over to the road)
  CROWD.forEach((c, i) => {
    const a = presence(t, follow(tTitik + 0.1, i, 0.03), null, 'smooth').alpha;
    if (a <= 0) return;
    const d = t - tTitik;
    dot(g, c.x + Math.cos(c.a) * c.v * d, c.y + Math.sin(c.a) * c.v * d, 9, a);
  });
  // one word slot, bottom-anchored
  B_WORDS.forEach(([s, t0], i) => {
    const tOut = i + 1 < B_WORDS.length ? B_WORDS[i + 1][1] - 0.08 : tC + 0.3;
    poster(g, t, s, SAFE.x0, 1500, B_SIZE[i], t0, tOut, { color: s === 'TITIK' ? INK : INK });
  });
}
function morphBox(t) {
  const out = {};
  for (const f of ['x', 'y', 'w', 'h', 'r']) out[f] = iosTrack(t, B_KEYS.map(([tk, b]) => [tk, b[f]]), 'hero');
  return out;
}

// ═════════════════════════════════════════════════════════════════════════════════════════════
// 01 MERAH — a diagonal 3-lane road, full bleed. Each road segment is painted from the dots around it
// (weighted average of speed). One dot stops for cilok: still green. Everyone slows: red.
// ═════════════════════════════════════════════════════════════════════════════════════════════
const ANG = 0.38, CEN = { x: 540, y: 900 }, RW = 640, LANES = [-213, 0, 213], HALF = 1400, LT = 2 * HALF;
const toScreen = (u, v) => ({ x: CEN.x + Math.cos(ANG) * v + Math.sin(ANG) * u, y: CEN.y + Math.sin(ANG) * v - Math.cos(ANG) * u });
const tC0 = tC - 2;
const tStop = w('L07', 'berhenti') - 0.25, U_STOP = 300, KK = 3;
const tSlow = w('L08', 'barengan') - 0.35, M_END = 0.1, KS = 1.5;
const tAvg = w('L09', 'dirata-rata'), tMerahC = w('L09', 'merah');
const CARS = (() => {
  const R = rng(5), N = 33, out = [];
  for (let i = 0; i < N; i++) out.push({ s0: (i + 0.35 * R()) * LT / N, lane: LANES[i % 3], vf: 230 + 80 * R(), ts: tSlow + 0.035 * i });
  return out;
})();
function car(c, t) {         // → { u, r } : position along the road + speed / free speed
  const d0 = t - tC0;
  let s, r = 1;
  if (t < c.ts) s = c.s0 + c.vf * d0;
  else {
    const d = t - c.ts, e = Math.exp(-KS * d);
    s = c.s0 + c.vf * (c.ts - tC0) + c.vf * M_END * d + c.vf * (1 - M_END) * (1 - e) / KS;
    r = M_END + (1 - M_END) * e;
  }
  return { u: ((s % LT) + LT) % LT - HALF, r };
}
const VF_CILOK = 270;
function cilok(t) {          // decelerates to a stop at U_STOP on "berhenti"
  if (t < tStop) return { u: U_STOP - VF_CILOK / KK - VF_CILOK * (tStop - t), r: 1 };
  const e = Math.exp(-KK * (t - tStop));
  return { u: U_STOP - (VF_CILOK / KK) * e, r: e };
}
const SEG = 64, SIGMA = 170, PRIOR = 0.3;
const BLOCKS_C = [...makeBlocks(21, -900, -380, -HALF - 200, HALF + 200), ...makeBlocks(22, 380, 900, -HALF - 200, HALF + 200)];

function merah(g, t) {
  g.fillStyle = GROUND; g.fillRect(0, 0, W, H);
  const pts = CARS.map((c) => ({ ...car(c, t), v: c.lane }));
  const ci = cilok(t);
  pts.push({ u: ci.u, r: ci.r, v: LANES[0], cilok: true });
  const s = dolly(t, tC, tD, 0.05);
  g.save();
  g.translate(CEN.x, CEN.y); g.scale(s, s); g.rotate(ANG);
  // road-space: x = v (across), y = −u (along, up)
  blocks(g, BLOCKS_C.map((b) => ({ ...b, y: -b.y - b.h })));
  g.fillStyle = ASPHALT; g.fillRect(-RW / 2, -HALF - 200, RW, LT + 400);
  g.globalAlpha = PAINT_A;
  for (let u = -HALF - 200; u < HALF + 200; u += SEG) {
    const uc = u + SEG / 2;
    let sw = PRIOR, sr = PRIOR;
    for (const p of pts) { const k = Math.exp(-(((p.u - uc) / SIGMA) ** 2)); sw += k; sr += k * p.r; }
    g.fillStyle = speedColor(sr / sw);
    g.fillRect(-RW / 2, -(u + SEG) - 1, RW, SEG + 2);
  }
  g.globalAlpha = 1;
  g.fillStyle = MARK;
  g.fillRect(-RW / 2 + 12, -HALF - 200, 6, LT + 400); g.fillRect(RW / 2 - 18, -HALF - 200, 6, LT + 400);
  for (const lx of [-107, 107]) for (let u = -HALF; u < HALF; u += 120) g.fillRect(lx - 3, -u, 6, 64);
  markText(g, 'MERAH', 0, 420, 150, ease(t, tMerahC - 0.3, 0.6, 'apple_out'));
  for (const p of pts) dot(g, p.v, -p.u, 13);
  g.restore();
  // the cilok stop: a ring on the dot, a small stall on the shoulder, a chip
  const cs = toScreen(ci.u, LANES[0]);       // left lane + left shoulder: stays inside the frame
  const sc = (q) => ({ x: CEN.x + (q.x - CEN.x) * s, y: CEN.y + (q.y - CEN.y) * s });
  const P = sc(cs), stall = sc(toScreen(U_STOP + 10, -(RW / 2 + 70)));
  const rp = presence(t, tStop - 0.2, tSlow + 0.6, 'snappy');
  if (rp.alpha > 0) {
    g.save(); g.globalAlpha = rp.alpha; g.strokeStyle = AMBER; g.lineWidth = 5;
    g.beginPath(); g.arc(P.x, P.y, 30 + 6 * Math.min(1, rp.move), 0, Math.PI * 2); g.stroke(); g.restore();
  }
  const stp = presence(t, w('L07', 'cilok') - 0.3, tSlow + 0.6, 'snappy');
  if (stp.alpha > 0) {
    g.save(); g.globalAlpha = stp.alpha; g.translate(stall.x, stall.y); g.scale(0.6 + 0.4 * Math.min(1, stp.move), 0.6 + 0.4 * Math.min(1, stp.move));
    roundRect(g, -36, -24, 72, 48, 8); g.fillStyle = '#D8CDB6'; g.fill();
    for (let k = 0; k < 6; k++) {
      g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 46, k * Math.PI / 3, (k + 1) * Math.PI / 3); g.closePath();
      g.fillStyle = k % 2 ? RED : '#F3EFE6'; g.globalAlpha = stp.alpha * 0.92; g.fill();
    }
    g.restore();
    chip(g, 'beli cilok', stall.x + 60, stall.y - 28, { a: stp.alpha, size: 32 });
  }
  // the averaging: a bracket along the left edge over the slow stretch
  const ap = presence(t, tAvg - 0.25, tD, 'smooth');
  if (ap.alpha > 0) {
    const a0 = sc(toScreen(-260, -RW / 2 - 40)), a1 = sc(toScreen(lerp(-260, 420, Math.min(1, ap.move)), -RW / 2 - 40));
    g.save(); g.globalAlpha = ap.alpha; g.strokeStyle = INK; g.lineWidth = 6; g.lineCap = 'round';
    g.beginPath(); g.moveTo(a0.x, a0.y); g.lineTo(a1.x, a1.y); g.stroke(); g.restore();
    const m = sc(toScreen(80, -RW / 2 - 40));
    chip(g, 'rata-rata', Math.max(SAFE.x0, m.x - 250), m.y - 30, { a: ap.alpha, size: 32 });
  }
}

// ═════════════════════════════════════════════════════════════════════════════════════════════
// 02 PREDIKSI — bento of the same road, same hour, past weeks; "sekarang" joins; they melt into one guess
// ═════════════════════════════════════════════════════════════════════════════════════════════
const STRIP = { x: SAFE.x0, w: COL_W, h: 104 };
const PAST = ['4 MINGGU LALU', '3 MINGGU LALU', '2 MINGGU LALU', 'MINGGU LALU']
  .map((label, k) => ({ label, y: 400 + k * 158, c: 0.56 + 0.035 * k, wd: 0.14 + 0.025 * k, depth: 0.78 + 0.06 * (k % 2) }));
const NOW = { label: 'SEKARANG', y: 1052, c: 0.64, wd: 0.2, depth: 0.86 };
const ALL = [...PAST, NOW];
const prof = (s, x) => 1 - s.depth * Math.exp(-(((x - s.c) / s.wd) ** 2));
const GUESS = { label: 'TEBAKAN', c: 0, wd: 0, depth: 0 };
const guessProf = (x) => ALL.reduce((a, s) => a + prof(s, x), 0) / ALL.length;
const tMasa = w('L10', 'masa'), tNow = w('L12', 'sekarang');
const tStrip0 = L('L10').start + 0.3, stripGap = clamp((w('L11', 'sama') - tStrip0) / 4, 0.25, 0.9);
const tMerge = Math.min(tNow + 0.75, tE - 0.75), MERGE_Y = 760;
const D_WORDS = [['MASA LALU', tMasa - 0.1, INK], ['+ SEKARANG', tNow - 0.1, RED], ['= TEBAKAN', tMerge + 0.1, INK]];
const D_SIZE = D_WORDS.map(([s]) => fit(s, 150));

function strip(g, t, s, y, h, a, { live = false, outline = false, profile = null } = {}) {
  if (a <= 0.001) return;
  const pf = profile || ((x) => prof(s, x));
  g.save(); g.globalAlpha *= a;
  roundRect(g, STRIP.x, y, STRIP.w, h, 22); g.save(); g.clip();
  g.fillStyle = ASPHALT; g.fillRect(STRIP.x, y, STRIP.w, h);
  g.globalAlpha = a * PAINT_A;
  const n = 48, sw = STRIP.w / n;
  for (let i = 0; i < n; i++) { g.fillStyle = speedColor(pf((i + 0.5) / n)); g.fillRect(STRIP.x + i * sw - 0.5, y, sw + 1, h); }
  g.globalAlpha = a;
  g.fillStyle = 'rgba(236,231,219,0.7)';
  for (let x = STRIP.x + 20; x < STRIP.x + STRIP.w; x += 90) g.fillRect(x, y + h / 2 - 3, 46, 6);
  if (live) {
    for (let k = 0; k < 9; k++) {
      const ph = ((k / 9 + 0.05 * (t - tD) * (0.6 + 0.4 * ((k * 7) % 3))) % 1 + 1) % 1;
      dot(g, STRIP.x + ph * STRIP.w, y + (k % 2 ? h * 0.3 : h * 0.7), 10);
    }
  }
  g.restore();
  if (outline) { roundRect(g, STRIP.x, y, STRIP.w, h, 22); g.strokeStyle = '#FFFFFF'; g.lineWidth = 5; g.stroke(); }
  g.font = `500 32px ${MONO}`; g.fillStyle = outline ? '#FFFFFF' : MUTE; g.textBaseline = 'alphabetic';
  g.fillText(s.label, STRIP.x + 4, y - 14);
  g.restore();
}
function prediksi(g, t) {
  g.fillStyle = GROUND; g.fillRect(0, 0, W, H);
  // the question pill: centre → top
  const qp = presence(t, L('L10').start - 0.15, tMerge + 0.2, 'snappy');
  chip(g, 'sampai jam berapa?', W / 2, 252 + 18 * (1 - Math.min(1, qp.move)), { align: 'center', size: 40, a: qp.alpha, fg: '#111214', bg: INK });
  const m = ease(t, tMerge, 0.9, 'apple_in_out');
  ALL.forEach((s, k) => {
    const t0 = s === NOW ? tNow - 0.2 : follow(tStrip0, k, stripGap);
    const p = presence(t, t0, null, 'smooth');
    if (p.alpha <= 0) return;
    const y = lerp(s.y, MERGE_Y, m) + 40 * (1 - Math.min(1, p.move));
    g.save(); g.translate(60 * (1 - Math.min(1, p.move)), 0);
    strip(g, t, s, y, STRIP.h, p.alpha * (1 - m), { live: s === NOW, outline: s === NOW });
    g.restore();
  });
  strip(g, t, GUESS, MERGE_Y - 20, STRIP.h + 40, m, { profile: guessProf, outline: true, live: true });
  D_WORDS.forEach(([s, t0, col], i) => {
    const tOut = i + 1 < D_WORDS.length ? D_WORDS[i + 1][1] - 0.08 : tE + 0.3;
    poster(g, t, s, SAFE.x0, 1500, D_SIZE[i], t0, tOut, { color: col });
  });
}

// ═════════════════════════════════════════════════════════════════════════════════════════════
// 03 CELAH — split: top = a quiet village road, one dot, thin dashed paint ("tipis");
// bottom = the cart again on an empty road, painted red → “MACET”
// ═════════════════════════════════════════════════════════════════════════════════════════════
const SPLIT = 960;
const Q0 = { x: 40, y: 900 }, Q1 = { x: 300, y: 520 }, Q2 = { x: 820, y: 840 }, Q3 = { x: 1060, y: 330 };
const qbez = (u) => {
  const a = (1 - u) ** 3, b = 3 * (1 - u) ** 2 * u, c = 3 * (1 - u) * u * u, d = u ** 3;
  return { x: a * Q0.x + b * Q1.x + c * Q2.x + d * Q3.x, y: a * Q0.y + b * Q1.y + c * Q2.y + d * Q3.y };
};
const VILLAGE = new Path2D(`M${Q0.x} ${Q0.y} C${Q1.x} ${Q1.y} ${Q2.x} ${Q2.y} ${Q3.x} ${Q3.y}`);
const tTipis = w('L13', 'tipis'), tCart2 = w('L14', 'sembilan') - 0.35, tMacet = w('L14', 'macet');
const ROAD_E = { y: 1060, h: 230 }, CART_E = 0.6;
const cartX = (t) => 110 + 120 * (t - tCart2);
const MACET_SIZE = fit('“MACET”', 190);

function celah(g, t) {
  g.fillStyle = '#121519'; g.fillRect(0, 0, W, SPLIT);
  g.fillStyle = GROUND; g.fillRect(0, SPLIT, W, H - SPLIT);
  const focus = ease(t, tCart2, 0.6, 'apple');
  // top: village road
  g.save(); g.beginPath(); g.rect(0, 0, W, SPLIT); g.clip();
  g.globalAlpha = 1 - 0.45 * focus;
  g.lineCap = 'round';
  g.strokeStyle = '#26282D'; g.lineWidth = 92; g.stroke(VILLAGE);
  g.strokeStyle = '#7C8088'; g.lineWidth = 16; g.setLineDash([26, 34]); g.lineDashOffset = -22 * (t - tE); g.stroke(VILLAGE);
  g.setLineDash([]);
  const u = 0.12 + 0.05 * (t - tE);
  const q = qbez(clamp(u, 0, 1));
  dot(g, q.x, q.y, 15);
  const qq = presence(t, w('L13', 'sepi') - 0.2, null, 'snappy');
  chip(g, '?', q.x + 30, q.y - 86, { a: qq.alpha, size: 36 });
  g.restore();
  poster(g, t, 'TIPIS', SAFE.x0, 440, 190, tTipis - 0.15, null);
  const tp = presence(t, tTipis + 0.15, null, 'smooth');
  chip(g, 'data sedikit → tebakan meleset', SAFE.x0, 480, { a: tp.alpha * (1 - 0.45 * focus), size: 28 });
  g.fillStyle = LINE; g.fillRect(0, SPLIT - 2, W, 4);
  // bottom: the cart again
  const bp = presence(t, tE - 0.1, null, 'smooth');      // the empty road waits; the cart rolls in on L14
  if (bp.alpha > 0) {
    g.save(); g.globalAlpha = bp.alpha;
    g.fillStyle = ASPHALT; g.fillRect(0, ROAD_E.y, W, ROAD_E.h);
    const cx = cartX(t), tail = cx - CART.h * CART_E / 2;
    g.globalAlpha = bp.alpha * PAINT_A;
    g.fillStyle = GREEN; g.fillRect(tail, ROAD_E.y, W - tail, ROAD_E.h);
    g.fillStyle = RED; g.fillRect(0, ROAD_E.y, tail + 40, ROAD_E.h);
    const xF = lerp(tail, W, ease(t, tMacet - 0.3, 0.9, 'apple_out'));
    if (xF > tail) g.fillRect(tail, ROAD_E.y, xF - tail, ROAD_E.h);
    g.globalAlpha = bp.alpha;
    g.fillStyle = MARK;
    g.fillRect(0, ROAD_E.y + 10, W, 5); g.fillRect(0, ROAD_E.y + ROAD_E.h - 15, W, 5);
    for (let x = -40; x < W; x += 120) g.fillRect(x, ROAD_E.y + ROAD_E.h / 2 - 3, 64, 6);
    g.save(); g.translate(cx, ROAD_E.y + ROAD_E.h * 0.7); g.rotate(Math.PI / 2); g.scale(CART_E, CART_E);
    drawCart(g, t); g.restore();
    g.restore();
  }
  poster(g, t, '“MACET”', SAFE.x0, 1500, MACET_SIZE, tMacet - 0.15, null, { color: INK, name: 'snappy' });
}

// ═════════════════════════════════════════════════════════════════════════════════════════════
// RECAP — pull out to a whole city drawn by dots: every coloured street is people stuck together
// ═════════════════════════════════════════════════════════════════════════════════════════════
const CITY = (() => {
  const R = rng(77), segs = [];
  const xs = [-40, 140, 310, 480, 650, 820, 990, 1150].map((x) => x + (R() - 0.5) * 40);
  const ys = []; for (let y = -120; y < H + 200; y += 170 + R() * 60) ys.push(y);
  const pick = () => { const r = R(); return r < 0.62 ? 0.9 : r < 0.84 ? 0.5 : 0.14; };
  for (const x of xs) for (let j = 0; j + 1 < ys.length; j++) segs.push({ x0: x, y0: ys[j], x1: x, y1: ys[j + 1], r: pick(), ph: R() });
  for (const y of ys) for (let j = 0; j + 1 < xs.length; j++) segs.push({ x0: xs[j], y0: y, x1: xs[j + 1], y1: y, r: pick(), ph: R() });
  return segs;
})();
const tSat = w('L15', 'satelit'), tKita = w('L15', 'kita'), tBareng = w('L15', 'bareng');
const KITA_SIZE = fit('ITU KITA.', 180);

function recap(g, t) {
  g.fillStyle = GROUND; g.fillRect(0, 0, W, H);
  const cam = push(t, tF - 0.1, { s: 2.6, x: 640, y: 1180 }, { s: 1, x: W / 2, y: H / 2 }, 2.4);
  cam.s *= dolly(t, tF + 2.3, tZ, 0.04);
  const thick = iosAt(t, tBareng - 0.15, 'smooth');
  g.save(); applyCam(g, cam, W, H);
  g.lineCap = 'round';
  for (const s of CITY) { g.strokeStyle = '#202227'; g.lineWidth = 40; g.beginPath(); g.moveTo(s.x0, s.y0); g.lineTo(s.x1, s.y1); g.stroke(); }
  g.globalAlpha = PAINT_A;
  for (const s of CITY) {
    g.strokeStyle = speedColor(s.r); g.lineWidth = s.r < 0.3 ? 16 + 10 * thick : 16;
    g.beginPath(); g.moveTo(s.x0, s.y0); g.lineTo(s.x1, s.y1); g.stroke();
  }
  g.globalAlpha = 1;
  for (const s of CITY) {
    const n = s.r < 0.3 ? 7 : s.r < 0.6 ? 4 : 2, v = s.r < 0.3 ? 0.03 : s.r < 0.6 ? 0.12 : 0.35;
    for (let k = 0; k < n; k++) {
      const p = ((s.ph + k / n + v * (t - tF)) % 1 + 1) % 1;
      dot(g, lerp(s.x0, s.x1, p), lerp(s.y0, s.y1, p), 5.5);
    }
  }
  g.restore();
  const sp = presence(t, tSat - 0.2, tKita - 0.3, 'snappy');
  chip(g, 'bukan satelit', W / 2, 270, { align: 'center', a: sp.alpha, size: 36 });
  const kp = presence(t, tKita - 0.45, null, 'smooth');
  if (kp.alpha > 0) {
    g.save(); g.globalAlpha = kp.alpha * 0.9;
    roundRect(g, SAFE.x0 - 24, 1300 + 30 * (1 - Math.min(1, kp.move)), COL_W + 48, 240, 36); g.fillStyle = GROUND; g.fill();
    g.restore();
  }
  poster(g, t, 'ITU KITA.', W / 2, 1468, KITA_SIZE, tKita - 0.3, null, { align: 'center', name: 'hero' });
}

// ── chapter pin: a tiny scale-bar label, bottom-right (00–03 only) ─────────────────────────────
function pin(g, t) {
  if (t < tB || t > tF + 0.2) return;
  const ln = FILM.lines.findLast((l) => l.start - 0.3 <= t);
  if (!ln || !/^\d\d · /.test(ln.chapter)) return;
  const since = FILM.lines.find((l) => l.chapter === ln.chapter).start - 0.3;
  const p = presence(t, since, tF - 0.2, 'snappy');
  g.save(); g.globalAlpha = p.alpha * 0.85;
  g.font = `500 28px ${MONO}`; g.textAlign = 'right'; g.textBaseline = 'alphabetic'; g.fillStyle = INK;
  g.fillText(ln.chapter, SAFE.x1, 1548);
  const tw = g.measureText(ln.chapter).width;
  g.fillStyle = RED; g.fillRect(SAFE.x1 - tw - 34, 1527, 20, 20);
  g.restore();
}

// ── sound: from the same times the picture uses ────────────────────────────────────────────────
const LOUD = [tRed, tMerahC, tMacet, tKita];
cue('whoosh', pushT0, 0.5);
for (const tc of [tC, tD, tE, tF]) cue('whoosh', tc, 0.4);
cue('click', tToggle, 0.6);
cue('send', tSend, 0.4);
CRUMBS.slice(0, 8).forEach((c) => cue('tick', c.t, 0.22));
cue('pop', w('L07', 'cilok'), 0.5);
cue('thud', tMerahC, 0.6);
cue('thud', tMacet, 0.6);
cue('chime', tKita, 0.5);
for (const s of T.stressed()) {
  if (s.start > tZ || LOUD.some((x) => Math.abs(x - s.start) < 0.3) || Math.abs(s.start - w('L07', 'cilok')) < 0.3) continue;
  cue('pop', s.start, 0.4);
}

// ── draw ───────────────────────────────────────────────────────────────────────────────────────
const SCENES = [[intro, -10, tB], [sensor, tB, tC], [merah, tC, tD], [prediksi, tD, tE], [celah, tE, tF], [recap, tF, tZ + 5]];
// a fading-in composition is drawn on its own layer first (scenes set absolute alphas inside)
const LAYER = new OffscreenCanvas(W, H), lg = LAYER.getContext('2d');
const PAT_LAYER = lg.createPattern(GRAIN, 'repeat');
let PAT_MAIN = ASPH;
const g = canvas((g, t) => {
  for (const [fn, a, b] of SCENES) {
    if (t < a - XF / 2 || t > b + XF / 2) continue;
    const al = ease(t, a - XF / 2, XF, 'apple');
    if (al >= 0.999) { ASPHALT = PAT_MAIN; g.save(); fn(g, t); g.restore(); continue; }
    if (al <= 0.001) continue;
    lg.setTransform(1, 0, 0, 1, 0, 0); lg.globalAlpha = 1; lg.clearRect(0, 0, W, H);
    ASPHALT = PAT_LAYER; lg.save(); fn(lg, t); lg.restore();
    g.save(); g.globalAlpha = al; g.drawImage(LAYER, 0, 0); g.restore();
  }
  pin(g, t);
});
PAT_MAIN = g.createPattern(GRAIN, 'repeat');
</script>
