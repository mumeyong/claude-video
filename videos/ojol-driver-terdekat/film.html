<!doctype html>
<meta charset="utf-8">
<title>ojol-driver-terdekat</title>
<link rel="stylesheet" href="/web/lib/fonts.css">
<canvas></canvas>
<script type="module">
// ojol-driver-terdekat — one printed city map, one camera, never cut (PLAN.md). The hero is the map: it gets sliced
// into sectors (squares → hexagons) and the search lights ring by ring from your dot. Every time comes from the voice.
import { FILM, ready, T, cue, canvas, SAFE } from '/web/lib/film.js';
import { clamp, lerp, rng, noise1, pulse, swapAlpha } from '/web/lib/motion.js';
import { iosAt, iosTrack, arrive, follow, presence, rise, ease, drawOn, morphBox, press, roundRect } from '/web/lib/apple.js';
await ready;

// ── look: printed map paper, navy ink, one ultramarine accent ─────────────────────────────────────
const PAPER = '#EFE8DA', BLOCK = '#E6DDCA', ROAD = '#FBF8F1', RIVER = '#CED6DC', INK = '#1A1C2E';
const MUTE = '#8A8270', ACC = '#4B2BFF', ON_ACC = '#FFFFFF';
const DISPLAY = '"Bricolage Grotesque"', MONO = '"IBM Plex Mono"';
await document.fonts.load(`800 120px ${DISPLAY}`);
await document.fonts.load(`500 30px ${MONO}`);
const { W, H } = FILM;
const g0 = new OffscreenCanvas(1, 1).getContext('2d');
const TYPE_W = SAFE.x1 - SAFE.x0 - 20;          // widest a line of type may get
const TOP = SAFE.y0 + 50, BOTTOM = SAFE.y1 - 40; // type rows

// ── map geometry (world px, you at 0,0) ──────────────────────────────────────────────────────────
const HEX = 72, SQ3 = Math.sqrt(3), CITY = 2500;       // hex size (centre → vertex), city radius
const SQ = 120;                                         // square sector size (geohash look)
const BLOCK_PX = 240, ROAD_W = 30, AVE_W = 46;
const hexXY = (q, r) => [HEX * SQ3 * (q + r / 2), HEX * 1.5 * r];
const hexDist = (q, r) => (Math.abs(q) + Math.abs(r) + Math.abs(q + r)) / 2;
function hexOf(x, y) {
  const fq = (SQ3 / 3 * x - y / 3) / HEX, fr = (2 / 3 * y) / HEX, fs = -fq - fr;
  let q = Math.round(fq), r = Math.round(fr), s = Math.round(fs);
  const dq = Math.abs(q - fq), dr = Math.abs(r - fr), ds = Math.abs(s - fs);
  if (dq > dr && dq > ds) q = -r - s; else if (dr > ds) r = -q - s;
  return [q, r];
}
const HOT = [4, -5];                                    // the cell that gets the rain (chapter 03)
const [HOT_X, HOT_Y] = hexXY(...HOT);
const hotDist = (q, r) => hexDist(q - HOT[0], r - HOT[1]);

// roads: an exact lattice near you, a looser one further out, two avenues and a river
const jit = (k, seed) => (Math.abs(k) <= 2 ? 0 : 34 * noise1(k * 1.7, seed));
const LATTICE = [];
for (let k = -11; k <= 11; k++) LATTICE.push(k);
const AVENUES = [[-2800, -980, 2800, 2380], [-2800, 1700, 2800, -2040]];
const riverY = (x) => 760 + 220 * Math.sin(x / 640) + 60 * Math.sin(x / 210);

// one-way street north of you + the two candidates (ring 2) and their routes
const ME = { x: 0, y: 0 };
const NEAR = { x: 0, y: -176, h: -Math.PI / 2 };       // closest — facing away, on a one-way road
const FAR = { x: 300, y: 0, h: Math.PI };              // further — already heading to you
const NEAR_ROUTE = [[0, -176], [0, -240], [-240, -240], [-240, 0], [0, 0]];
const FAR_ROUTE = [[300, 0], [0, 0]];
const OUTRO_ROUTE = [[720, -480], [720, 240], [-480, 240], [-480, -720], [240, -720], [240, -240], [0, -240], [0, 0]];
const len = (p) => p.slice(1).reduce((s, b, i) => s + Math.hypot(b[0] - p[i][0], b[1] - p[i][1]), 0);
function along(p, d) {
  for (let i = 1; i < p.length; i++) {
    const [ax, ay] = p[i - 1], [bx, by] = p[i], l = Math.hypot(bx - ax, by - ay);
    if (d <= l || i === p.length - 1) {
      const f = clamp(d / l);
      return { x: lerp(ax, bx, f), y: lerp(ay, by, f), h: Math.atan2(by - ay, bx - ax) };
    }
    d -= l;
  }
}
const pathOf = (p) => { const P = new Path2D(); p.forEach(([x, y], i) => (i ? P.lineTo(x, y) : P.moveTo(x, y))); return P; };

// drivers: seeded, never inside rings 0–2 (the story's candidates live there) or the rain cell
const rnd = rng(26);
const DRIVERS = [];
while (DRIVERS.length < 190) {
  const a = rnd() * Math.PI * 2, d = 330 + Math.sqrt(rnd()) * (CITY - 380);
  const x = Math.cos(a) * d, y = Math.sin(a) * d, [q, r] = hexOf(x, y);
  if (hexDist(q, r) < 3 || hotDist(q, r) < 1) continue;
  DRIVERS.push({ x, y, h: rnd() * Math.PI * 2, i: DRIVERS.length });
}
const HOT_DRIVER = { x: HOT_X - 30, y: HOT_Y + 24, h: 0.6, i: 900 };
// neighbours of the rain cell that get pulled in on "sebelah"
const PULL = [[1, 0], [0, 1], [-1, 1], [0, -1]].map(([dq, dr], j) => {
  const [cx, cy] = hexXY(HOT[0] + dq, HOT[1] + dr);
  const x = cx + 22 * Math.cos(j * 2.1), y = cy + 22 * Math.sin(j * 2.1);
  const tx = HOT_X + 38 * Math.cos(j * 1.6 + 0.5), ty = HOT_Y + 38 * Math.sin(j * 1.6 + 0.5);
  return { x, y, tx, ty, h: Math.atan2(ty - y, tx - x), i: 950 + j };
});
// orders piling up in the rain cell
const ORDERS = Array.from({ length: 14 }, (_, i) => {
  const a = i * 2.39996, d = 10 + 50 * Math.sqrt((i + 0.5) / 14);
  return { x: HOT_X + Math.cos(a) * d, y: HOT_Y + Math.sin(a) * d * 0.95 };
});

// ── times: all from the voice ────────────────────────────────────────────────────────────────────
const w = (id, word, nth = 0) => T.word(id, word, nth);
const S = (id) => T.line(id).start, E = (id) => T.line(id).end;
const tm = {
  pesan: w('L01', 'Pesan'), jalan: w('L01', 'jalan'),
  banyak: w('L02', 'banyak'), gimana: w('L02', 'Gimana'),
  semua: w('L03', 'semua'), lambat: w('L03', 'lambat'),
  dipotong: w('L04', 'dipotong'), stadion: w('L04', 'stadion'), sektor: w('L04', 'sektor'),
  nyatet: w('L05', 'nyatet'), mana: w('L05', 'mana'),
  geohash: w('L06', 'geohash'), h3: w('L06', 'H3'), uber: w('L06', 'Uber'),
  berdiri: w('L07', 'berdiri'), kosong: w('L08', 'Kosong'), cincin: w('L08', 'cincin'), lagi: w('L08', 'lagi'),
  teriak: w('L09', 'teriak'), langsung: w('L09', 'langsung'), sektornya: w('L09', 'sektornya'),
  dekat: w('L10', 'dekat'), dipilih: w('L10', 'dipilih'),
  sebaliknya: w('L11', 'sebaliknya'), kepotong: w('L11', 'kepotong'), arah: w('L11', 'arah', 1),
  searah: w('L12', 'searah'), kelar: w('L12', 'kelar'), duluan: w('L12', 'duluan'),
  hujan: w('L13', 'hujan'), numpuk: w('L13', 'numpuk'), segitu: w('L13', 'segitu'),
  naik: w('L14', 'naik'), narik: w('L14', 'narik'), sebelah: w('L14', 'sebelah'),
  bukan: w('L15', 'bukan'), komputer: w('L15', 'komputer'), tapi: w('L15', 'tapi'), kotak: w('L15', 'kotak'),
  muter: w('L16', 'muter'), komentar: w('L16', 'komentar'),
};
const RACE = [tm.searah, tm.duluan + 0.1];
const END = FILM.end;

// ── camera: one move after another, springs bend into the next target (log zoom) ────────────────
const CAM = [
  [0, { s: 1.75, x: 0, y: 70 }],
  [S('L01'), { s: 1.55, x: 40, y: 50 }],
  [tm.jalan - 0.3, { s: 1.3, x: 120, y: 40 }],
  [arrive(tm.banyak, 'hero'), { s: 0.42, x: 0, y: -60 }],
  [S('L03'), { s: 0.5, x: 0, y: -120 }],
  [tm.dipotong - 0.2, { s: 0.72, x: 0, y: 40 }],
  [S('L05'), { s: 1.12, x: 0, y: -40 }],
  [tm.geohash - 0.35, { s: 0.92, x: 0, y: 230 }],
  [S('L07'), { s: 1.95, x: 0, y: 40 }],
  [tm.cincin - 0.2, { s: 1.45, x: 0, y: 40 }],
  [tm.lagi - 0.25, { s: 1.12, x: 30, y: 40 }],
  [S('L09'), { s: 0.62, x: 0, y: 420 }],
  [S('L10'), { s: 1.7, x: 150, y: -110 }],
  [S('L12'), { s: 1.4, x: 120, y: -150 }],
  [S('L13') - 0.1, { s: 2.5, x: HOT_X, y: HOT_Y - 40 }],
  [tm.narik - 0.2, { s: 1.35, x: HOT_X, y: HOT_Y - 60 }],
  [S('L15') - 0.15, { s: 0.36, x: 0, y: -200 }],
  [S('L16') - 0.1, { s: 0.78, x: 120, y: -40 }],
];
function camAt(t) {
  const ls = iosTrack(t, CAM.map(([k, c]) => [k, Math.log(c.s)]), 'hero');
  const x = iosTrack(t, CAM.map(([k, c]) => [k, c.x]), 'hero'), y = iosTrack(t, CAM.map(([k, c]) => [k, c.y]), 'hero');
  return { s: Math.exp(ls) * (1 + 0.012 * noise1(t * 0.25, 7)), x: x + 10 * noise1(t * 0.3, 1), y: y + 10 * noise1(t * 0.3, 2) };
}
const proj = (c, x, y) => [W / 2 + (x - c.x) * c.s, H / 2 + (y - c.y) * c.s];

// ── states over time ─────────────────────────────────────────────────────────────────────────────
const fadeOut = (t, t0, dur = 0.45) => 1 - ease(t, t0, dur, 'apple_in');
const sqOn = (t, k) => iosAt(t, tm.dipotong - 0.1 + 0.035 * k) * fadeOut(t, tm.h3 - 0.05 + 0.02 * k, 0.5);
const hexOn = (t, k) => iosAt(t, tm.h3 + 0.03 * k, 'smooth');
const streetDim = (t) => iosAt(t, S('L10')) - iosAt(t, S('L13'));

/** Accent fill of a hex cell at t (0..1): intro ripple, ring search, rain cell, recap wave. */
function cellFill(t, q, r) {
  const k = hexDist(q, r);
  let a = 0;
  if (k <= 8) a += 0.38 * pulse(t, [tm.pesan + 0.07 * k], 3.2) * (1 - k / 9);
  const search = fadeOut(t, S('L10') - 0.1, 0.6);
  if (k === 0) a += (0.62 * iosAt(t, arrive(tm.berdiri, 'snappy'), 'snappy') - 0.42 * iosAt(t, tm.kosong)) * search;
  if (k === 1) a += (0.5 * iosAt(t, arrive(tm.cincin, 'snappy') + 0.02 * ((q * 7 + r * 3) & 3), 'snappy') - 0.32 * iosAt(t, tm.lagi)) * search;
  if (k === 2) a += 0.5 * iosAt(t, arrive(tm.lagi, 'snappy') + 0.02 * ((q * 5 + r) & 3), 'snappy') * search;
  if (k >= 3 && k <= 7) a += 0.16 * (1 - k / 8) * iosAt(t, S('L09') + 0.12 * (k - 3)) * search;
  const h = hotDist(q, r);
  if (h === 0) a += 0.34 * presence(t, tm.numpuk - 1.0, S('L15') - 0.2).alpha;
  if (h === 1) a += 0.12 * presence(t, tm.sebelah - 0.2, S('L15') - 0.2).alpha;
  if (k <= 24) a += 0.26 * (1 - k / 26) * iosAt(t, S('L15') + 0.05 * k) * fadeOut(t, S('L16') - 0.2, 0.8);
  return clamp(a);
}

// ── sound: the same times the picture uses ───────────────────────────────────────────────────────
cue('click', tm.pesan, 0.6); cue('pop', tm.jalan, 0.4); cue('whoosh', arrive(tm.banyak, 'hero'), 0.45);
cue('pop', tm.gimana, 0.35);
cue('whoosh_dark', tm.semua, 0.4); cue('thud', tm.lambat, 0.5);
cue('whoosh', tm.dipotong, 0.4); cue('pop', tm.sektor, 0.45);
[0, 1, 2].forEach((i) => cue('tick', tm.nyatet + 0.12 * i, 0.35));
cue('key', tm.geohash, 0.45); cue('whoosh', tm.h3, 0.4); cue('tick', tm.uber, 0.3);
cue('pop', tm.berdiri, 0.45); cue('tick', tm.kosong, 0.4); cue('pop', tm.cincin, 0.4); cue('chime', tm.lagi, 0.45);
cue('whoosh', S('L09'), 0.35); cue('pop', tm.langsung, 0.4);
cue('whoosh', S('L10'), 0.4); cue('pop', tm.dipilih, 0.45);
cue('tick', tm.sebaliknya, 0.4); cue('click', tm.arah, 0.4);
cue('send', tm.searah, 0.45); cue('chime', tm.duluan, 0.5);
cue('whoosh_dark', tm.hujan - 0.2, 0.45);
[0, 4, 8, 12].forEach((i) => cue('tick', tm.numpuk - 0.9 + 0.09 * i, 0.3)); cue('thud', tm.segitu, 0.4);
cue('pop', tm.naik, 0.45); cue('whoosh', tm.sebelah, 0.4);
cue('whoosh', S('L15'), 0.4); cue('chime', tm.kotak, 0.5);
cue('pop', tm.muter, 0.4);

// ── type helpers (laid out once) ─────────────────────────────────────────────────────────────────
function fit(str, size, font = DISPLAY, weight = 800, maxW = TYPE_W) {
  for (; size > 40; size -= 4) { g0.font = `${weight} ${size}px ${font}`; if (g0.measureText(str).width <= maxW) break; }
  g0.font = `${weight} ${size}px ${font}`;
  return { str, size, font, weight, w: g0.measureText(str).width };
}
function say(g, t, tIn, tOut, L, x, y, { color = INK, align = 'left', name = 'smooth', dy = 44 } = {}) {
  const bx = align === 'center' ? x - L.w / 2 : align === 'right' ? x - L.w : x;
  rise(g, t, tIn, tOut, [bx, y, L.w, L.size], (g) => {
    g.font = `${L.weight} ${L.size}px ${L.font}`; g.fillStyle = color; g.textBaseline = 'top'; g.textAlign = 'left';
    g.fillText(L.str, bx, y);
  }, { dy, name });
  return bx;
}
const TY = {
  udah: fit('udah', 200), jalan: fit('jalan.', 200),
  kotakmu: fit('kotakmu dulu.', 150), melebar: fit('lalu melebar.', 150),
  secepat: fit('secepat', 200), itu: fit('itu?', 200),
  satu: fit('satu-satu?', 190),
  stadion: fit('kayak tribun stadion', 34, MONO, 500), sektor: fit('sektor.', 230),
  geohash: fit('geohash', 150, MONO, 500), h3: fit('H3', 260), uber: fit('grid hexagon · open-source Uber', 32, MONO, 500),
  teriak: fit('teriak ke semua', 84), kotak2: fit('kotak-kotak', 170), langsung: fit('langsung ke', 150), sektornya: fit('sektornya.', 150),
  terdekat: fit('terdekat ≠', 150), dipilih: fit('dipilih.', 150), duluan: fit('duluan.', 200),
  pesanan: fit('pesanan', 160), numpuk: fit('numpuk.', 160), narik: fit('narik dari', 140), sebelah: fit('kotak sebelah.', 140),
  bukan: fit('bukan komputer super', 40, MONO, 500), peta: fit('peta yang', 170), dipotong: fit('dipotong', 170), kotak: fit('kotak.', 170),
  muter: fit('muter jauh?', 170), komentar: fit('ceritain di komentar ↓', 36, MONO, 500),
  online: fit('driver online · sekota', 34, MONO, 500),
};
function strike(g, t, t0, x, y, wdt, tOut) {
  const P = new Path2D(); P.moveTo(x - 10, y); P.lineTo(x + wdt + 10, y - 6);
  drawOn(g, t, t0, P, wdt + 24, { dur: 0.45, color: ACC, width: 12, tOut });
}
function chip(g, t, tIn, tOut, str, x, y, { fill = INK, ink = PAPER, size = 32, name = 'snappy' } = {}) {
  g.font = `500 ${size}px ${MONO}`;
  const tw = g.measureText(str).width, pw = tw + size * 1.2, ph = size * 1.8;
  const bx = clamp(x - pw / 2, SAFE.x0, SAFE.x1 - pw), by = clamp(y - ph / 2, SAFE.y0, SAFE.y1 - ph);
  rise(g, t, tIn, tOut, [bx, by, pw, ph], (g) => {
    roundRect(g, bx, by, pw, ph, ph / 2); g.fillStyle = fill; g.fill();
    g.font = `500 ${size}px ${MONO}`; g.fillStyle = ink; g.textBaseline = 'middle'; g.textAlign = 'center';
    g.fillText(str, bx + pw / 2, by + ph / 2 + 1);
  }, { dy: 16, name });
}

// paper grain, seeded once
const GRAIN = new OffscreenCanvas(270, 480);
{
  const x = GRAIN.getContext('2d'), img = x.createImageData(270, 480), gr = rng(7);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = gr() < 0.5 ? 0 : 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = Math.floor(gr() * 26);
  }
  x.putImageData(img, 0, 0);
}

// ── draw: world (under the camera) ──────────────────────────────────────────────────────────────
function view(c) {
  const hw = W / 2 / c.s, hh = H / 2 / c.s;
  return { x0: c.x - hw - 120, x1: c.x + hw + 120, y0: c.y - hh - 120, y1: c.y + hh + 120 };
}
function roads(g, c, v) {
  g.fillStyle = BLOCK; g.fillRect(v.x0, v.y0, v.x1 - v.x0, v.y1 - v.y0);
  // river
  g.beginPath();
  for (let x = Math.max(v.x0, -CITY - 600); x <= Math.min(v.x1, CITY + 600); x += 40) {
    const y = riverY(x); x === Math.max(v.x0, -CITY - 600) ? g.moveTo(x, y) : g.lineTo(x, y);
  }
  g.strokeStyle = RIVER; g.lineWidth = 110; g.lineCap = 'round'; g.stroke();
  // lattice
  g.strokeStyle = ROAD; g.lineCap = 'butt';
  for (const k of LATTICE) {
    const x = k * BLOCK_PX + jit(k, 3), y = k * BLOCK_PX + jit(k, 5);
    g.lineWidth = ROAD_W;
    if (x > v.x0 && x < v.x1) { g.beginPath(); g.moveTo(x, v.y0); g.lineTo(x, v.y1); g.stroke(); }
    if (y > v.y0 && y < v.y1) { g.beginPath(); g.moveTo(v.x0, y); g.lineTo(v.x1, y); g.stroke(); }
  }
  g.lineWidth = AVE_W;
  for (const [ax, ay, bx, by] of AVENUES) { g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke(); }
  // thin centre lines read as a printed map at street level
  g.strokeStyle = 'rgba(26,28,46,0.07)'; g.lineWidth = 2;
  for (const k of LATTICE) {
    const x = k * BLOCK_PX + jit(k, 3), y = k * BLOCK_PX + jit(k, 5);
    if (x > v.x0 && x < v.x1) { g.beginPath(); g.moveTo(x, v.y0); g.lineTo(x, v.y1); g.stroke(); }
    if (y > v.y0 && y < v.y1) { g.beginPath(); g.moveTo(v.x0, y); g.lineTo(v.x1, y); g.stroke(); }
  }
}
function hexPath(g, x, y, R = HEX) {
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI / 180) * (-90 + 60 * i);
    i ? g.lineTo(x + R * Math.cos(a), y + R * Math.sin(a)) : g.moveTo(x + R * Math.cos(a), y + R * Math.sin(a));
  }
  g.closePath();
}
const cityFade = (x, y) => clamp((CITY + 200 - Math.hypot(x, y)) / 500);
function grids(g, t, c, v) {
  const lw = 2.4 / c.s, dim = 1 - 0.55 * streetDim(t);
  // squares (geohash look) — swept out by Chebyshev ring
  if (t > tm.dipotong - 0.2 && t < tm.h3 + 1.2) {
    g.strokeStyle = INK; g.lineWidth = lw;
    for (let i = Math.floor(v.x0 / SQ) - 1; i <= Math.ceil(v.x1 / SQ); i++)
      for (let j = Math.floor(v.y0 / SQ) - 1; j <= Math.ceil(v.y1 / SQ); j++) {
        const k = Math.max(Math.abs(i), Math.abs(j)), a = sqOn(t, k) * cityFade(i * SQ, j * SQ);
        if (a < 0.01) continue;
        g.globalAlpha = 0.22 * a; g.strokeRect(i * SQ - SQ / 2, j * SQ - SQ / 2, SQ, SQ);
      }
    g.globalAlpha = 1;
  }
  // hexagons — lines once H3 is named, fills whenever a state lights a cell
  const r0 = Math.floor(v.y0 / (1.5 * HEX)) - 1, r1 = Math.ceil(v.y1 / (1.5 * HEX)) + 1;
  for (let r = r0; r <= r1; r++) {
    const q0 = Math.floor(v.x0 / (HEX * SQ3) - r / 2) - 1, q1 = Math.ceil(v.x1 / (HEX * SQ3) - r / 2) + 1;
    for (let q = q0; q <= q1; q++) {
      const k = hexDist(q, r);
      const [x, y] = hexXY(q, r), cf = cityFade(x, y);
      if (cf <= 0) continue;
      const fa = cellFill(t, q, r) * cf, la = hexOn(t, k) * cf * dim;
      if (fa < 0.01 && la < 0.01) continue;
      g.beginPath(); hexPath(g, x, y, HEX - 1.5 / c.s);
      if (fa >= 0.01) { g.globalAlpha = fa; g.fillStyle = ACC; g.fill(); }
      if (la >= 0.01) { g.globalAlpha = 0.24 * la; g.strokeStyle = INK; g.lineWidth = lw; g.stroke(); }
    }
  }
  g.globalAlpha = 1;
}
function spider(g, t, c) {
  if (t < tm.semua - 0.3 || t > tm.lambat + 0.6) return;
  const out = fadeOut(t, tm.lambat + 0.05, 0.4);
  g.strokeStyle = INK; g.lineWidth = 1.6 / c.s;
  for (const d of DRIVERS) {
    const dist = Math.hypot(d.x, d.y), p = ease(t, tm.semua - 0.2 + dist / CITY * 0.7, 0.45, 'apple_out');
    if (p <= 0) continue;
    g.globalAlpha = 0.28 * out;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(d.x * p, d.y * p); g.stroke();
  }
  g.globalAlpha = 1;
}
function oneWay(g, t, c) {
  const a = presence(t, tm.arah - 0.15, S('L13') - 0.2, 'snappy').alpha;
  if (a <= 0.01) return;
  g.fillStyle = INK;
  for (let i = 0; i < 5; i++) {
    const y = -40 - 90 * i, ai = a * clamp(iosAt(t, tm.arah - 0.15 + 0.06 * i, 'snappy'));
    g.globalAlpha = 0.55 * ai;
    g.beginPath(); g.moveTo(0, y - 16); g.lineTo(9, y + 6); g.lineTo(0, y + 1); g.lineTo(-9, y + 6); g.closePath(); g.fill();
  }
  g.globalAlpha = 1;
}
function routes(g, t, c) {
  // intro teaser: the chosen driver's line to you
  drawOn(g, t, tm.jalan - 0.1, pathOf(FAR_ROUTE), 300, { dur: 0.7, color: ACC, width: 9 / c.s ** 0.5, tOut: tm.banyak - 0.2 });
  // chapter 02: the loop the nearest one has to make, and the straight line of the far one
  g.save(); g.setLineDash([14, 12]);
  drawOn(g, t, tm.kepotong, pathOf(NEAR_ROUTE), len(NEAR_ROUTE), { dur: 1.1, color: INK, width: 5, tOut: S('L13') - 0.2 });
  g.restore();
  drawOn(g, t, tm.searah - 0.25, pathOf(FAR_ROUTE), 300, { dur: 0.6, color: ACC, width: 9, tOut: S('L13') - 0.2 });
  // outro: the long way round
  drawOn(g, t, tm.muter - 0.3, pathOf(OUTRO_ROUTE), len(OUTRO_ROUTE), { dur: 2.2, color: ACC, width: 10 / c.s ** 0.5 });
}

// ── draw: things that keep their screen size (projected) ─────────────────────────────────────────
function driverGlyph(g, x, y, h, r, fill, a = 1) {
  if (a <= 0.01) return;
  g.save(); g.globalAlpha *= a; g.translate(x, y);
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fillStyle = fill; g.fill();
  g.rotate(h);
  g.beginPath(); g.moveTo(r * 0.62, 0); g.lineTo(-r * 0.38, -r * 0.48); g.lineTo(-r * 0.14, 0); g.lineTo(-r * 0.38, r * 0.48);
  g.closePath(); g.fillStyle = PAPER; g.fill();
  g.restore();
}
function nearPos(t) {
  const [t0, t1] = RACE, d = 300 * ease(t, t0, t1 - t0, 'apple') + Math.max(0, t - t1) * 160;
  return t < t0 ? NEAR : along(NEAR_ROUTE, Math.min(d, len(NEAR_ROUTE)));
}
function farPos(t) {
  const [t0, t1] = RACE;
  return t < t0 ? FAR : along(FAR_ROUTE, 300 * ease(t, t0, t1 - t0, 'apple'));
}
function people(g, t, c, v) {
  const r = 13 * clamp(Math.sqrt(c.s), 0.72, 1.7);
  const inView = (x, y) => x > v.x0 && x < v.x1 && y > v.y0 && y < v.y1;
  for (const d of DRIVERS) {
    const wob = 7 * noise1(t * 0.35, d.i);
    const x = d.x + Math.cos(d.h) * wob, y = d.y + Math.sin(d.h) * wob;
    if (!inView(x, y)) continue;
    const [sx, sy] = proj(c, x, y);
    driverGlyph(g, sx, sy, d.h, r, INK, cityFade(d.x, d.y));
  }
  // rain cell: one driver inside, neighbours get pulled in
  { const [sx, sy] = proj(c, HOT_DRIVER.x, HOT_DRIVER.y); driverGlyph(g, sx, sy, HOT_DRIVER.h, r, INK); }
  PULL.forEach((p, j) => {
    const k = iosAt(t, follow(tm.sebelah - 0.1, j, 0.14), 'smooth');
    const [sx, sy] = proj(c, lerp(p.x, p.tx, k), lerp(p.y, p.ty, k));
    driverGlyph(g, sx, sy, p.h, r, k > 0.02 && t < S('L15') ? ACC : INK);
  });
  // the two candidates
  const lit = iosAt(t, arrive(tm.lagi, 'snappy'), 'snappy') * fadeOut(t, S('L13') - 0.2, 0.6);
  const n = nearPos(t), f = farPos(t);
  for (const [p, accent] of [[n, false], [f, true]]) {
    const [sx, sy] = proj(c, p.x, p.y);
    if (lit > 0.01) { g.beginPath(); g.arc(sx, sy, r * (1.9 + 0.3 * pulse(t, [tm.lagi, tm.dipilih], 4)), 0, Math.PI * 2);
      g.strokeStyle = accent ? ACC : INK; g.globalAlpha = 0.7 * lit; g.lineWidth = 3; g.stroke(); g.globalAlpha = 1; }
    const hot = accent ? Math.max(iosAt(t, tm.jalan - 0.1) * fadeOut(t, tm.banyak, 0.5), iosAt(t, tm.searah) * fadeOut(t, S('L13'), 0.6)) : 0;
    driverGlyph(g, sx, sy, p.h, r * (1 + 0.25 * hot), hot > 0.5 ? ACC : INK);
  }
  // orders piling up (other customers)
  ORDERS.forEach((o, i) => {
    const k = presence(t, tm.numpuk - 0.9 + 0.09 * i, S('L15') - 0.2 + 0.01 * i, 'snappy');
    if (k.alpha <= 0.01) return;
    const [sx, sy] = proj(c, o.x, o.y), rr = r * 0.8 * Math.min(1.15, k.move);
    g.globalAlpha = k.alpha;
    g.beginPath(); g.arc(sx, sy, rr + 3, 0, Math.PI * 2); g.fillStyle = PAPER; g.fill();
    g.beginPath(); g.arc(sx, sy, rr, 0, Math.PI * 2); g.fillStyle = ACC; g.fill();
    g.globalAlpha = 1;
  });
  // you
  const [mx, my] = proj(c, ME.x, ME.y), R = 15 * clamp(Math.sqrt(c.s), 0.85, 1.4);
  const ping = (t - FILM.pre_roll) % 1.6 / 1.6;
  if (t > FILM.pre_roll - 0.5) {
    g.beginPath(); g.arc(mx, my, R + 46 * ping, 0, Math.PI * 2);
    g.strokeStyle = ACC; g.globalAlpha = 0.5 * (1 - ping); g.lineWidth = 3; g.stroke(); g.globalAlpha = 1;
  }
  g.beginPath(); g.arc(mx, my, R + 5, 0, Math.PI * 2); g.fillStyle = PAPER; g.fill();
  g.beginPath(); g.arc(mx, my, R, 0, Math.PI * 2); g.fillStyle = ACC; g.fill();
}
function labels(g, t, c) {
  // stadium sector labels printed on the squares
  const la = presence(t, tm.sektor - 0.1, tm.h3 - 0.15).alpha;
  if (la > 0.01) {
    g.font = `500 ${Math.round(clamp(22 * c.s + 8, 24, 34))}px ${MONO}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (let i = -4; i <= 4; i++) for (let j = -6; j <= 6; j++) {
      const [sx, sy] = proj(c, i * SQ, j * SQ - SQ * 0.3);
      if (sx < SAFE.x0 || sx > SAFE.x1 || sy < SAFE.y0 || sy > SAFE.y1) continue;
      const k = Math.max(Math.abs(i), Math.abs(j));
      g.globalAlpha = 0.5 * la * clamp(iosAt(t, tm.sektor - 0.1 + 0.05 * k));
      g.fillStyle = INK; g.fillText(String.fromCharCode(74 + i) + (j + 7), sx, sy);
    }
    g.globalAlpha = 1;
  }
  // each driver notes its sector
  const near = DRIVERS.map((d) => [Math.hypot(d.x, d.y + 40), d]).sort((a, b) => a[0] - b[0]).slice(0, 5).map((x) => x[1]);
  near.forEach((d, i) => {
    const [sx, sy] = proj(c, d.x, d.y), ci = Math.round(d.x / SQ), cj = Math.round(d.y / SQ);
    chip(g, t, follow(tm.nyatet, i, 0.12), tm.geohash - 0.3, `→ ${String.fromCharCode(74 + ci)}${cj + 7}`, sx + 70, sy - 40, { size: 28 });
  });
  // ring search
  const [mx, my] = proj(c, 0, 0);
  chip(g, t, tm.kosong, tm.cincin - 0.1, 'kosong', mx, my - 92 * c.s / 1.6 - 40);
  chip(g, t, tm.cincin, tm.lagi - 0.1, 'cincin 1 · kosong', mx, my + 2.2 * HEX * c.s);
  chip(g, t, tm.lagi, S('L09') + 0.2, 'cincin 2 · ketemu', mx, my + 3.6 * HEX * c.s, { fill: ACC, ink: ON_ACC });
  // street level: the two candidates
  const n = nearPos(t), f = farPos(t), [nx, ny] = proj(c, n.x, n.y), [fx, fy] = proj(c, f.x, f.y);
  chip(g, t, tm.dekat, tm.sebaliknya - 0.05, 'terdekat', nx - 130, ny);
  chip(g, t, tm.sebaliknya, S('L13') - 0.3, 'ngadep sebaliknya', nx - 170, ny);
  chip(g, t, tm.searah, S('L13') - 0.3, 'searah', fx + 30, fy - 150, { fill: ACC, ink: ON_ACC });
  chip(g, t, tm.kelar, S('L13') - 0.3, 'baru kelar order', fx + 30, fy - 85);
  // stamp on the winner
  const st = presence(t, tm.duluan - 0.05, S('L13') - 0.3, 'snappy');
  if (st.alpha > 0.01) {
    g.save(); g.globalAlpha = st.alpha; g.translate(mx + 110, my + 60); g.rotate(-0.12); g.scale(1.3 - 0.3 * Math.min(1, st.move), 1.3 - 0.3 * Math.min(1, st.move));
    g.font = `800 52px ${DISPLAY}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    const tw = g.measureText('DIPILIH').width + 40;
    roundRect(g, -tw / 2, -40, tw, 80, 14); g.lineWidth = 6; g.strokeStyle = ACC; g.stroke();
    g.fillStyle = ACC; g.fillText('DIPILIH', 0, 3); g.restore();
  }
  // rain cell
  const [hx, hy] = proj(c, HOT_X, HOT_Y);
  chip(g, t, tm.segitu - 0.1, tm.narik - 0.2, 'driver: tetap segitu', hx, hy + HEX * c.s + 50);
  chip(g, t, tm.naik, S('L15') - 0.3, 'tarif ↑', hx, hy - HEX * c.s - 40, { fill: ACC, ink: ON_ACC, size: 34 });
}
function rain(g, t) {
  const a = presence(t, tm.hujan - 0.25, S('L15') - 0.25).alpha;
  if (a <= 0.01) return;
  const rr = rng(11);
  g.strokeStyle = INK; g.lineWidth = 3; g.lineCap = 'round';
  for (let i = 0; i < 110; i++) {
    const x0 = rr() * (W + 600), y0 = rr() * (H + 300), sp = 1500 + rr() * 900, l = 40 + rr() * 50;
    const y = ((y0 + t * sp) % (H + 300)) - 150, x = x0 - (y + 150) * 0.32 - 100;
    g.globalAlpha = a * (0.12 + 0.12 * rr());
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - l * 0.32, y - l); g.stroke();
  }
  g.globalAlpha = 1;
}

// ── draw: the intro button (UI as an object) ─────────────────────────────────────────────────────
const BTN = [
  [0, { x: 190, y: 1310, w: 700, h: 170, r: 85 }],
  [tm.pesan + 0.12, { x: 170, y: 1330, w: 740, h: 130, r: 65 }],
  [tm.jalan - 0.2, { x: 130, y: 1330, w: 820, h: 130, r: 65 }],
];
function button(g, t) {
  const pr = presence(t, FILM.pre_roll - 0.6, tm.banyak - 0.25);
  if (pr.alpha <= 0.01) return;
  const b = morphBox(t, BTN, 'snappy'), s = press(t, tm.pesan);
  g.save(); g.globalAlpha = pr.alpha;
  g.translate(b.x + b.w / 2, b.y + b.h / 2 + 60 * (1 - Math.min(1, pr.move))); g.scale(s, s); g.translate(-(b.x + b.w / 2), -(b.y + b.h / 2));
  g.shadowColor = 'rgba(26,28,46,0.22)'; g.shadowBlur = 40; g.shadowOffsetY = 14;
  roundRect(g, b.x, b.y, b.w, b.h, b.r); g.fillStyle = ACC; g.fill();
  g.shadowColor = 'transparent';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = ON_ACC;
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  g.globalAlpha = pr.alpha * swapAlpha(t, -1, tm.pesan + 0.12); g.font = `800 84px ${DISPLAY}`; g.fillText('Pesan', cx, cy + 4);
  g.globalAlpha = pr.alpha * swapAlpha(t, tm.pesan + 0.12, tm.jalan - 0.2); g.font = `500 46px ${MONO}`;
  g.fillText('mencari driver' + '.'.repeat(1 + Math.floor((t * 3) % 3)), cx, cy + 2);
  g.globalAlpha = pr.alpha * swapAlpha(t, tm.jalan - 0.2, 1e9); g.fillText('driver jalan ke kamu →', cx, cy + 2);
  g.restore();
}

// ── draw: type, per chapter a different place ────────────────────────────────────────────────────
function type(g, t) {
  const X = SAFE.x0 + 10;
  // INTRO — the answer first, top-left, then the question over the whole city
  say(g, t, arrive(tm.jalan), tm.banyak - 0.3, TY.udah, X, TOP);
  say(g, t, follow(arrive(tm.jalan)), tm.banyak - 0.3, TY.jalan, X, TOP + 190, { color: ACC });
  say(g, t, tm.banyak - 0.1, S('L03') - 0.25, TY.online, X, TOP, { color: MUTE, dy: 20 });
  say(g, t, arrive(tm.gimana), S('L03') - 0.25, TY.secepat, X, TOP + 60);
  say(g, t, follow(arrive(tm.gimana)), S('L03') - 0.25, TY.itu, X, TOP + 60 + TY.secepat.size * 0.95, { color: ACC });
  // 00 — "satu-satu?" struck out, then bottom-anchored "sektor."
  const sx = say(g, t, arrive(tm.semua), tm.dipotong - 0.2, TY.satu, X, TOP + 20);
  strike(g, t, tm.lambat - 0.1, sx, TOP + 20 + TY.satu.size * 0.55, TY.satu.w, tm.dipotong - 0.2);
  say(g, t, arrive(tm.dipotong), tm.nyatet - 0.2, TY.kotak2, X, TOP);
  say(g, t, tm.stadion - 0.15, tm.nyatet - 0.2, TY.stadion, X, BOTTOM - TY.sektor.size - 60, { color: INK, dy: 20 });
  say(g, t, arrive(tm.sektor), tm.nyatet - 0.2, TY.sektor, X, BOTTOM - TY.sektor.size, { color: ACC });
  // L06 — the name under the map
  say(g, t, arrive(tm.geohash, 'snappy'), tm.h3 - 0.2, TY.geohash, X, BOTTOM - 230, { dy: 30 });
  say(g, t, arrive(tm.h3, 'smooth'), S('L07') - 0.2, TY.h3, X, BOTTOM - 300, { color: ACC });
  say(g, t, tm.uber - 0.1, S('L07') - 0.2, TY.uber, X, BOTTOM - 20, { color: INK, dy: 16 });
  // 01 — top while the rings light, then bottom-anchored under the rings
  say(g, t, S('L07') + 0.05, S('L09') - 0.25, TY.kotakmu, X, TOP);
  say(g, t, arrive(tm.cincin), S('L09') - 0.25, TY.melebar, X, TOP + 160, { color: ACC });
  const tx = say(g, t, tm.teriak - 0.1, S('L10') - 0.25, TY.teriak, X, BOTTOM - 2 * 150 - 100, { color: INK, dy: 24 });
  strike(g, t, tm.teriak + 0.35, tx, BOTTOM - 2 * 150 - 100 + TY.teriak.size * 0.55, TY.teriak.w, S('L10') - 0.25);
  say(g, t, arrive(tm.langsung), S('L10') - 0.25, TY.langsung, X, BOTTOM - 2 * 150 + 10);
  say(g, t, arrive(tm.sektornya), S('L10') - 0.25, TY.sektornya, X, BOTTOM - 150 + 10, { color: ACC });
  // 02 — top, then the result at the bottom
  say(g, t, S('L10') + 0.05, S('L11') + 0.3, TY.terdekat, X, TOP);
  say(g, t, arrive(tm.dipilih), S('L11') + 0.3, TY.dipilih, X, TOP + 150, { color: ACC });
  say(g, t, arrive(tm.duluan), S('L13') - 0.25, TY.duluan, X, BOTTOM - TY.duluan.size, { color: ACC });
  // 03 — top, the rain cell fills the middle
  say(g, t, tm.hujan, S('L14') - 0.2, TY.pesanan, X, TOP);
  say(g, t, arrive(tm.numpuk), S('L14') - 0.2, TY.numpuk, X, TOP + 160, { color: ACC });
  say(g, t, tm.narik - 0.1, S('L15') - 0.25, TY.narik, X, TOP);
  say(g, t, arrive(tm.sebelah), S('L15') - 0.25, TY.sebelah, X, TOP + 150, { color: ACC });
  // RECAP — type is the picture, centred over the lit city
  const cx = W / 2, cy = 760;
  const bx = say(g, t, tm.bukan - 0.1, S('L16') - 0.25, TY.bukan, cx, cy - 120, { align: 'center', color: INK, dy: 18 });
  strike(g, t, tm.komputer + 0.3, bx, cy - 120 + 22, TY.bukan.w, S('L16') - 0.25);
  say(g, t, arrive(tm.tapi), S('L16') - 0.25, TY.peta, cx, cy, { align: 'center' });
  say(g, t, follow(arrive(tm.tapi)), S('L16') - 0.25, TY.dipotong, cx, cy + 170, { align: 'center' });
  say(g, t, arrive(tm.kotak), S('L16') - 0.25, TY.kotak, cx, cy + 340, { align: 'center', color: ACC });
  // OUTRO — bottom
  say(g, t, arrive(tm.muter), END + 1, TY.muter, X, BOTTOM - 240);
  say(g, t, tm.komentar - 0.1, END + 1, TY.komentar, X, BOTTOM - 40, { color: INK, dy: 18 });
}

// a paper wash behind the recap type so it reads over the lit city
function wash(g, t) {
  const a = presence(t, tm.tapi - 0.3, S('L16') - 0.3).alpha;
  if (a <= 0.01) return;
  const gr = g.createRadialGradient(W / 2, 960, 60, W / 2, 960, 640);
  gr.addColorStop(0, 'rgba(239,232,218,0.92)'); gr.addColorStop(1, 'rgba(239,232,218,0)');
  g.globalAlpha = a; g.fillStyle = gr; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
}

canvas((g, t) => {
  const c = camAt(t), v = view(c);
  g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
  g.save();
  g.translate(W / 2, H / 2); g.scale(c.s, c.s); g.translate(-c.x, -c.y);
  roads(g, c, v);
  grids(g, t, c, v);
  spider(g, t, c);
  oneWay(g, t, c);
  routes(g, t, c);
  g.restore();
  people(g, t, c, v);
  labels(g, t, c);
  rain(g, t);
  button(g, t);
  wash(g, t);
  type(g, t);
  g.globalAlpha = 1; g.imageSmoothingEnabled = false; g.drawImage(GRAIN, 0, 0, W, H); g.imageSmoothingEnabled = true;
});
</script>
